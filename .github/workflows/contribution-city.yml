name: Contribution City

on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contribution-city.yml'
      - 'config/contribution-city.json'

permissions:
  contents: write

concurrency:
  group: contribution-city
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate animated contribution city
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/contribution-city.json
      - name: Publish generated SVG
        run: |
          test -s profile-3d-contrib/profile-city.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-city.svg
          if git diff --cached --quiet; then
            echo "Contribution city is already current."
          else
            git commit -m "chore: refresh contribution city"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
