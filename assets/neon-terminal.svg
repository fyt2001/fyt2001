<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="title desc">
<title id="title">FYT / interactive ideas, executable code</title><desc id="desc">Animated decorative terminal with typing, blinking cursor, rotating reactor and flowing packets. This is artwork, not live telemetry.</desc>
<defs>
<pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#22d3ee" stroke-opacity=".07"/></pattern>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040b17"/><stop offset="1" stop-color="#111028"/></linearGradient>
<linearGradient id="scan" x2="0" y2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".1"/></linearGradient>
<clipPath id="round"><rect width="960" height="350" rx="12"/></clipPath>
<clipPath id="typing"><rect x="35" y="83" width="550" height="33"><animate attributeName="width" values="0;0;550;550;0" keyTimes="0;.06;.32;.92;1" dur="9s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="960" height="350" fill="url(#bg)"/><rect width="960" height="350" fill="url(#g)"/>
<rect x="1" y="1" width="958" height="348" rx="12" fill="none" stroke="#23354d"/>
<path d="M0 40H960M619 40V308M0 308H960" stroke="#23354d"/>
<g><circle cx="23" cy="21" r="5" fill="#ff5f57"/><circle cx="42" cy="21" r="5" fill="#febc2e"/><circle cx="61" cy="21" r="5" fill="#28c840"/></g>
<text x="88" y="25" fill="#7d91af" font-family="monospace" font-size="12">fyt@github: ~/workbench</text>
<text x="805" y="25" fill="#536b88" font-family="monospace" font-size="10">SVG / MOTION LOOP</text>
<g font-family="monospace">
<text x="35" y="76" fill="#22d3ee" font-size="13">❯ whoami</text>
<text x="35" y="109" fill="#e2faff" font-size="27" font-weight="bold" letter-spacing="1" clip-path="url(#typing)">FYT / BUILDER · TINKERER</text>
<text x="35" y="150" fill="#778eac" font-size="13">const interests = [</text>
<text x="56" y="178" fill="#a78bfa" font-size="14">"games", "useful tools", "automation"</text>
<text x="35" y="206" fill="#778eac" font-size="13">];</text>
<text x="35" y="244" fill="#34d399" font-size="14">❯ turn_ideas_into_things()</text>
<rect x="285" y="231" width="8" height="16" fill="#34d399"><animate attributeName="opacity" values="1;0;1" dur="1s" calcMode="discrete" repeatCount="indefinite"/></rect>
<text x="35" y="280" fill="#647d9d" font-size="11">EXPLORE → BUILD → VERIFY → ITERATE</text>
</g>
<g transform="translate(790 166)">
<circle r="92" fill="#22d3ee" fill-opacity=".025" stroke="#19364b"/>
<circle r="76" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="80 22 8 22" opacity=".8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite"/></circle>
<circle r="60" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="7 14" opacity=".7"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/></circle>
<path d="M-106 0h38M68 0h38M0-106v38M0 68v38" stroke="#29516a"/>
<rect x="-33" y="-33" width="66" height="66" rx="10" fill="#0b1728" stroke="#22d3ee" stroke-width="1.5"><animate attributeName="stroke" values="#22d3ee;#a78bfa;#22d3ee" dur="5s" repeatCount="indefinite"/></rect>
<text y="7" text-anchor="middle" fill="#e2faff" font-family="monospace" font-size="23" font-weight="bold">&lt;/&gt;</text>
<g><circle cx="0" cy="-92" r="4" fill="#34d399"/><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/></g>
<circle r="42" fill="none" stroke="#22d3ee" opacity=".15"><animate attributeName="r" values="40;92" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values=".5;0" dur="3s" repeatCount="indefinite"/></circle>
</g>
<text x="790" y="289" text-anchor="middle" fill="#637d9d" font-family="monospace" font-size="10" letter-spacing="2">CURIOSITY ENGINE</text>
<g font-family="monospace" font-size="11"><text x="35" y="333" fill="#6f8ba9">JAVA / PYTHON / WEB</text><text x="490" y="333" fill="#22d3ee">KEEP SHIPPING SMALL THINGS</text><text x="837" y="333" fill="#a78bfa">FYT.DEV</text></g>
<rect x="0" y="-60" width="960" height="60" fill="url(#scan)" pointer-events="none"><animate attributeName="y" from="-60" to="350" dur="7s" repeatCount="indefinite"/></rect>
</g></svg>